[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statstools"
version = "0.2.0"
description = "统一计算工具"
authors = [
    {name = "caomh", email = "minghaocao@yeah.net"}
]
license = {text = "MIT"}
keywords = ["statistics", "tools", "calculation"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 需要安装的依赖
dependencies = [
    "polars>=1.35,<2",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "numba>=0.67,<0.68",
    "pyarrow>=14",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "statannotations>=0.7,<1",
    "scikit-learn>=1.3,<2",
    "connectorx>=0.4,<1",
    "jax>=0.4,<1",
    "numpyro>=0.13,<1",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
]
# 限定python版本
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
    "mypy"
]

[project.scripts]
statstools = "statstools:main"

[project.urls]
Homepage = "https://github.com/HuTaoJiaZiAckerman/statstools"
Repository = "https://github.com/HuTaoJiaZiAckerman/statstools"
Issues = "https://github.com/HuTaoJiaZiAckerman/statstools/issues"
